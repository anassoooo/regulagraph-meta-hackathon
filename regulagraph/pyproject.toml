[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regulagraph"
version = "0.1.0"
description = "AI Regulatory Impact Investigation Agent for public Central Bank of Tunisia regulations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # BSD-3-Clause. The crypto extra (cryptography: Apache-2.0 OR BSD-3-Clause) is needed
    # to open AES-encrypted PDFs that only carry an owner password.
    "pypdf[crypto]>=6,<7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
