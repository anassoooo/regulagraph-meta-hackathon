[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regulagraph"
version = "0.1.0"
description = "AI Regulatory Impact Investigation Agent for public Central Bank of Tunisia regulations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 1.x only: PyMuPDF 2.x adds onnxruntime/numpy layout dependencies we do not need.
    "pymupdf>=1.24,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
